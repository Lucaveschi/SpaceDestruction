<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Destruction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      cursor: none;
      image-rendering: pixelated;
    }
    #hint {
      color: #005500;
      font: 11px "Courier New", monospace;
      margin-top: 6px;
      letter-spacing: 1px;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint">FRECCE: muovi | SPAZIO: spara | ESC: pausa</div>
  <script src="game.js"></script>
</body>
</html>
